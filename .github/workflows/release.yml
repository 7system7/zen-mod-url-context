name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged version
        uses: actions/checkout@v4

      - name: Build release ZIP
        run: |
          git archive --format=zip \
            --prefix=zen-mod-url-context/ \
            --output=zen-mod-url-context.zip \
            HEAD -- zen-url-context.css install.py Makefile README.md LICENSE assets

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            zen-mod-url-context.zip \
            zen-url-context.css \
            --verify-tag \
            --title "$TAG" \
            --generate-notes
